plugins {
    id 'com.android.application'
}

def autoVersionCode = project.hasProperty('AUTO_VERSION_CODE') ? project.property('AUTO_VERSION_CODE').toString().toInteger() : 1
def autoVersionName = project.hasProperty('AUTO_VERSION_NAME') ? project.property('AUTO_VERSION_NAME').toString() : '1.0.0'

android {
    namespace 'com.chk.bluelocktier'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chk.bluelocktier'
        minSdk 21
        targetSdk 34
        versionCode autoVersionCode
        versionName autoVersionName
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion '1.8.22'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
