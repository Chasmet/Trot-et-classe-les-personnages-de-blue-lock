plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chk.bluelocktier'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chk.bluelocktier'
        minSdk 21
        targetSdk 34
        versionCode (project.findProperty('AUTO_VERSION_CODE') ?: '1') as int
        versionName project.findProperty('AUTO_VERSION_NAME') ?: '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
