name: Android APK + mise à jour interne

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Gradle
        run: chmod +x gradlew

      - name: Compiler APK debug
        run: ./gradlew assembleDebug --max-workers=2

      - name: Compiler APK release non signée
        run: ./gradlew assembleRelease -PAUTO_VERSION_CODE=${{ github.run_number }} -PAUTO_VERSION_NAME=1.0.${{ github.run_number }} --max-workers=2

      - name: Récupérer la clé Android permanente
        run: |
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8 -o "$RUNNER_TEMP/testkey.pk8"
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem -o "$RUNNER_TEMP/testkey.x509.pem"

      - name: Signer toujours avec la même clé
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" sign \
            --key "$RUNNER_TEMP/testkey.pk8" \
            --cert "$RUNNER_TEMP/testkey.x509.pem" \
            --out "Steal-a-Striker-Index-v1.0.${{ github.run_number }}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose "Steal-a-Striker-Index-v1.0.${{ github.run_number }}.apk"

      - name: Vérifier le certificat permanent
        run: |
          openssl x509 -in "$RUNNER_TEMP/testkey.x509.pem" -outform DER -out "$RUNNER_TEMP/signing-cert.der"
          ACTUAL_CERT=$(sha256sum "$RUNNER_TEMP/signing-cert.der" | cut -d ' ' -f1)
          test "$ACTUAL_CERT" = "$(cat .github/signing-certificate.sha256)"

      - name: Publier Artifact GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Steal-a-Striker-Index-v1.0.${{ github.run_number }}
          path: Steal-a-Striker-Index-v1.0.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Créer la Release pour la mise à jour interne
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Steal a Striker Index v1.0.${{ github.run_number }}
          body: |
            APK Android de Steal a Striker Index.
            Les cases cochées sont stockées localement et restent conservées lors d'une installation par-dessus.
            L'application vérifie automatiquement releases/latest et propose l'installation de la nouvelle version.
          files: Steal-a-Striker-Index-v1.0.${{ github.run_number }}.apk
          make_latest: true
